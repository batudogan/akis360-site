<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Akış360 — Erişim</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #F6F6F7; --surface: #fff; --ink: #141414; --ink-soft: #555A62; --ink-faint: #9A9EA6;
    --line: #E6E6E8; --red: #E8391A; --red-ink: #C22C10; --red-soft: #FDE9E4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: var(--bg); color: var(--ink);
    font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 20px; padding: 36px 32px; box-shadow: 0 30px 60px -30px rgba(20,20,20,.25);
  }
  .logo { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; font-size: 22px; letter-spacing: -0.02em; }
  .logo b { color: var(--red); }
  .logo svg { width: 30px; height: 30px; }
  h1 { font-size: 20px; margin: 24px 0 6px; letter-spacing: -0.01em; }
  p { margin: 0; color: var(--ink-soft); font-size: 14.5px; line-height: 1.55; }
  form { margin-top: 22px; display: grid; gap: 12px; }
  label { font-size: 13px; font-weight: 600; color: var(--ink-soft); }
  input {
    width: 100%; font: inherit; font-size: 16px; padding: 12px 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); outline: none;
  }
  input:focus { border-color: var(--red); box-shadow: 0 0 0 3px var(--red-soft); }
  button {
    font: inherit; font-weight: 700; font-size: 15px; padding: 13px; border-radius: 999px;
    border: 0; background: var(--red); color: #fff; cursor: pointer;
  }
  button:hover { background: var(--red-ink); }
  button:disabled { opacity: .6; cursor: wait; }
  .err { display: none; color: var(--red-ink); background: var(--red-soft); padding: 10px 12px; border-radius: 10px; font-size: 13.5px; font-weight: 600; }
  .err.show { display: block; }
  .foot { margin-top: 22px; font-size: 12.5px; color: var(--ink-faint); }
</style>
</head>
<body>
<div class="card">
  <span class="logo">
    <svg viewBox="0 0 28 28" fill="none" aria-hidden="true">
      <circle cx="14" cy="14" r="11" stroke="#E8391A" stroke-width="3" stroke-dasharray="52 18" stroke-linecap="round"/>
      <path d="M18 5 L23 7 L20.5 11.5" stroke="#E8391A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Akış<b>360</b>
  </span>
  <h1>Bu sayfa şifre korumalı</h1>
  <p>Tanıtım sitesinin ön izlemesi. Devam etmek için size iletilen şifreyi girin.</p>
  <form id="gate">
    <label for="pw">Şifre</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus required />
    <div class="err" id="err">Şifre hatalı. Tekrar deneyin.</div>
    <button type="submit" id="go">Sayfayı aç</button>
  </form>
  <p class="foot">İçerik tarayıcınızda çözülür; şifre sunucuya gönderilmez.</p>
</div>

<script>
  // OpenSSL "enc -aes-256-cbc -pbkdf2 -iter 100000 -md sha256 -salt" çıktısı (base64).
  // Format: "Salted__" + 8 bayt salt + şifreli veri. PBKDF2 → 32 bayt anahtar + 16 bayt IV.
  var CIPHERTEXT = "{{CIPHERTEXT}}";
  var ITER = 100000;

  async function decrypt(password) {
    var raw = atob(CIPHERTEXT);
    var bytes = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
    var salt = bytes.slice(8, 16), ct = bytes.slice(16);
    var km = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
    var bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: salt, iterations: ITER, hash: 'SHA-256' }, km, 384);
    var key = await crypto.subtle.importKey('raw', bits.slice(0, 32), { name: 'AES-CBC' }, false, ['decrypt']);
    var pt = await crypto.subtle.decrypt({ name: 'AES-CBC', iv: bits.slice(32, 48) }, key, ct);
    var html = new TextDecoder().decode(pt);
    if (html.indexOf('<!DOCTYPE html') !== 0) throw new Error('bad');
    return html;
  }

  async function open(password) {
    var html = await decrypt(password);
    try { sessionStorage.setItem('akis360_pw', password); } catch (e) {}
    document.open(); document.write(html); document.close();
  }

  document.getElementById('gate').addEventListener('submit', async function (e) {
    e.preventDefault();
    var btn = document.getElementById('go'), err = document.getElementById('err');
    btn.disabled = true; err.classList.remove('show');
    try { await open(document.getElementById('pw').value); }
    catch (_) { err.classList.add('show'); btn.disabled = false; document.getElementById('pw').select(); }
  });

  // Aynı sekmede daha önce açıldıysa tekrar sorma
  try {
    var saved = sessionStorage.getItem('akis360_pw');
    if (saved) open(saved).catch(function () { sessionStorage.removeItem('akis360_pw'); });
  } catch (e) {}
</script>
</body>
</html>
